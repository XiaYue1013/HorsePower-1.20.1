modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/GoryMoon/HorsePower/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://www.curseforge.com/minecraft/mc-mods/horse-power"
credits="Original mod by Gory_Moon. Darkosto for coming up with the idea. Ported to Forge 1.20.1 from Horse Power 2.6.4 (1.12.2)."
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jei"
    mandatory=false
    versionRange="[15,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="crafttweaker"
    mandatory=false
    versionRange="[14,)"
    ordering="AFTER"
    side="BOTH"
